# Standalone file: docker compose -f compose.tun.yaml up -d
services:
  prizrak:
    image: ghcr.io/vrbeeshop/mihomo-prizrak-docker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NETWORK_MODE: tun
      MIXED_BIND_ADDRESS: 127.0.0.1
      EXTERNAL_CONTROLLER_ADDRESS: 127.0.0.1
      DNS_LISTEN: 127.0.0.1:1053
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/etc/mihomo
