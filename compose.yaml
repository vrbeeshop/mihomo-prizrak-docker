services:
  prizrak:
    image: mihomo-prizrak-docker:local
    build:
      context: .
      args:
        PRIZRAK_VERSION: ${PRIZRAK_VERSION:-v1.19.34-r2}
        WITH_GVISOR: ${WITH_GVISOR:-0}
        UPX: ${UPX:-0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NETWORK_MODE: proxy
      MIXED_BIND_ADDRESS: 0.0.0.0
      EXTERNAL_CONTROLLER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${MIXED_PORT:-1080}:${MIXED_PORT:-1080}/tcp"
      - "127.0.0.1:${MIXED_PORT:-1080}:${MIXED_PORT:-1080}/udp"
      - "127.0.0.1:${UI_PORT:-9090}:${UI_PORT:-9090}/tcp"
    volumes:
      - ./data:/etc/mihomo
